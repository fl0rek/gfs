<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WayQuest</title>
<!--
  /nix/view/wayquest/index.html — WayQuest as a view: every comb in datacombs, as one world.

  Each comb is a region of the world with its own biome. A comb that carries a wayfinder map
  (.scratch/<effort>/map.md plus issues/NN-*.md) is charted: its region is that map's overworld, with
  cleared territory, the frontier, explorers at work, beacons (monsters) where you are needed, and fog
  for what is not yet specified. A comb without a map is land with a building on it.

  Everything WayQuest knows about wayfinder (parsing, sensing, layout, roads, terrain, what changed)
  comes from its own world crate, compiled to wasm: world.js + world_bg.wasm, beside this file.
  This page only reads files, places the regions and draws. The sprites are Kenney's (CC0), in sheets/.

  The host gives this page window.ue (all reads are read-only, by gfs path):
    ue.combs                 every comb: name, head, entries, files, newest entry, git remote
    ue.list(dir)             every file under a directory: [[path relative to dir, size]]
    ue.read(path)            a file as text; ue.bytes(path) as bytes. /datacombs/<comb>@<entry>/… is the past
    ue.log(comb)             a comb's history entries, newest first
    ue.onHistory(fn)         fn(comb) whenever any comb gets a history entry
    ue.prompt(text)          send a message to the console as the user
    ue.state, ue.setState(o) a little state the host keeps for this view across re-renders
  It is pi's to change, like any file in /nix; every change is a history entry and can be rolled back.
-->
<style>
:root { --bg:#0f1216; --panel:#161a20; --panel2:#1d232b; --line:#29313b; --fg:#e7eaef; --muted:#8a94a4; --accent:#ffcc66; --link:#8cc8ff;
        --cleared:#9aa3ad; --frontier:#a6f08c; --claimed:#ffc94d; --held:#ff6b59; --blocked:#5c6578;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 var(--sans); -webkit-text-size-adjust:100%; overflow:hidden; }
button { font:inherit; color:inherit; cursor:pointer; }
input { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.mono { font-family:var(--mono); font-size:12px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.link { color:var(--link); cursor:pointer; }
.link:hover { text-decoration:underline; }
.loading { display:flex; align-items:center; justify-content:center; height:100%; flex-direction:column; gap:10px; color:var(--muted); padding:20px; text-align:center; }
.loading b { color:var(--fg); font-size:18px; letter-spacing:.02em; }
.err { color:#ff9d9d; white-space:pre-wrap; font-family:var(--mono); font-size:12px; }

.world { position:fixed; inset:0; display:grid; grid-template-columns:1fr 370px; grid-template-rows:1fr; }
.stage { position:relative; overflow:hidden; background:#2c6f8c; min-height:0; }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:grab; }
.stage canvas.drag { cursor:grabbing; }
.hud { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
.hud button { width:34px; height:34px; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:rgba(15,18,22,.78); font-size:16px; line-height:1; }
.title-plate { position:absolute; left:10px; top:10px; background:rgba(15,18,22,.8); border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:5px 10px; pointer-events:none; }
.brand { font-size:17px; font-weight:700; letter-spacing:.01em; }
.brand span { color:var(--accent); }
.legend { position:absolute; left:10px; bottom:10px; background:rgba(15,18,22,.78); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:5px 9px; font-size:11.5px; display:flex; gap:10px; flex-wrap:wrap; max-width:calc(100% - 70px); }
.legend span { display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }
.panel { border-left:1px solid var(--line); background:var(--panel); overflow:auto; min-height:0; padding:10px 14px 30px; }
.panel h3 { font-size:16px; margin:2px 0 6px; line-height:1.3; }
.panel h4 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 6px; font-weight:600; }
.crumbs { font-size:12px; color:var(--muted); margin-bottom:4px; }
.row { display:flex; gap:9px; align-items:baseline; padding:5px 0; min-width:0; }
.row.click { cursor:pointer; }
.row.click:hover .t { text-decoration:underline; }
.row .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .proj { color:var(--muted); font-family:var(--mono); font-size:11.5px; flex:none; }
.totals { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:8px 0 4px; }
.total { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
.total .v { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
.total .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.needs { background:linear-gradient(180deg, rgba(255,107,89,.10), rgba(255,107,89,.03)); border:1px solid rgba(255,107,89,.35); border-radius:9px; padding:2px 10px; }
.proj-row { display:flex; flex-direction:column; gap:4px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.proj-row:last-child { border-bottom:none; }
.proj-row .top { display:flex; gap:8px; align-items:baseline; }
.proj-row .name { font-weight:650; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.swatch { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; border:1px solid rgba(255,255,255,.25); }
.bar { height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; display:flex; }
.bar i { display:block; height:100%; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; gap:5px; align-items:center; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.pill { display:inline-block; padding:0 7px; border-radius:999px; font-size:11px; font-weight:600; font-family:var(--mono); background:var(--panel2); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.pill.git { color:#b9d7ff; } .pill.bad { color:var(--held); }
.feed .row { align-items:flex-start; }
.feed .when { color:var(--muted); font-size:12px; width:58px; flex:none; font-variant-numeric:tabular-nums; }
.feed .what { flex:1; min-width:0; }
.feed .who { color:var(--muted); font-size:12px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; margin:8px 0; }
.kv dt { color:var(--muted); } .kv dd { margin:0; min-width:0; overflow-wrap:anywhere; }
.md { font-size:13.5px; overflow-wrap:anywhere; }
.md h4 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:14px 0 4px; }
.md p { margin:6px 0; }
.md ul, .md ol { margin:6px 0; padding-left:20px; }
.md li { margin:2px 0; }
.md code { font-family:var(--mono); font-size:12px; background:var(--panel2); padding:0 4px; border-radius:4px; }
.md pre { background:var(--panel2); padding:8px; border-radius:6px; overflow:auto; font-size:12px; }
.md pre code { background:none; padding:0; }
.md .ext { color:var(--link); border-bottom:1px dotted var(--link); }
.ask { display:flex; gap:6px; margin-top:10px; }
.ask input { flex:1; min-width:0; }
.ask button { border:1px solid transparent; background:var(--accent); color:#1a1408; font-weight:650; border-radius:6px; padding:6px 10px; }
.note { color:var(--accent); font-size:12px; margin:4px 0; }
.settings { margin-top:22px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12px; }
.settings input { width:120px; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#222a35; border:1px solid var(--line); padding:8px 12px; border-radius:8px; font-size:13px; max-width:90vw; z-index:10; }
.sheet-toggle { display:none; }

@media (max-width: 760px) {
  .world { grid-template-columns:1fr; grid-template-rows:1fr auto; }
  .panel { border-left:none; border-top:1px solid var(--line); max-height:48vh; padding-top:4px; }
  .panel.collapsed { overflow:hidden; }
  .panel.collapsed .content { display:none; }
  .sheet-toggle { display:flex; width:100%; justify-content:space-between; align-items:center; background:none; border:none; padding:4px 0 8px; color:var(--muted); font-size:12px; gap:8px; }
  .sheet-toggle span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend { display:none; }
}

<div id="app"><div class="loading"><b>WayQuest</b><span>charting datacombs…</span></div></div>
<script>
(async function () {
"use strict";
const ue = window.ue;
const app = document.getElementById("app");
if (!ue || !ue.read) {
  app.innerHTML = '<div class="loading"><b>WayQuest</b><span>This view needs a host that gives it <code>window.ue</code> with gfs reads.</span></div>';
  return;
}
const HERE = (ue.view && ue.view.path ? ue.view.path : "/nix/view/wayquest/index.html").replace(/\/[^/]*$/, "");

// ---------- helpers ----------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);

  return el;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function ago(t) {
  if (!t) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
  return new Date(t).toISOString().slice(0, 10);
}
const short = (id) => (id ? String(id).slice(0, 8) : "");
const trim = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
let toastTimer = 0;
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  document.body.append(h("div", { class: "toast" }, text));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.querySelectorAll(".toast").forEach((t) => t.remove()), 3500);
}
const STATE_COLOR = { cleared: "var(--cleared)", frontier: "var(--frontier)", claimed: "var(--claimed)", held: "var(--held)", blocked: "var(--blocked)" };
const STATE_WORD = { cleared: "cleared", frontier: "frontier", claimed: "under way", held: "your move", blocked: "blocked" };
const combPath = (name) => (name === "nix" ? "/nix" : `/datacombs/${name}`);
// What the combs every node has are for (this prototype's own; any other comb is the user's).
const COMB_ABOUT = {
  nix: "The running system: its flake, machine.json (the packages the shell runs, each pinned by sha256) and the views, this one included. A change to machine.json is a switch.",
  session: "pi's conversation: transcript.json, committed once per turn, so what was said sits in the same kind of history as what changed.",
  workspace: "pi's working directory: where it writes unless told otherwise.",
};

// ---------- state the host keeps for us ----------
const S = Object.assign({ sel: null, cam: null, player: "florek", sheet: true }, ue.state || {});
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => ue.setState && ue.setState({ sel: S.sel, cam: S.cam, player: S.player, sheet: S.sheet }), 250);
}

// ---------- WayQuest's world crate (wasm) ----------
async function loadWorld() {
  const wasm = await ue.bytes(`${HERE}/world_bg.wasm`);
  // A host may have run the glue already (the standalone page does, as an inline script).
  let mod = window.__wqWorld;
  if (!mod) {
    const js = await ue.read(`${HERE}/world.js`);
    try {
      mod = await import(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
    } catch (e) {
      // No module import from a blob here: run the same glue as a classic script.
      const s = document.createElement("script");
      s.textContent = classicGlue(js);
      document.head.append(s);
      mod = window.__wqWorld;
      if (!mod) throw e;
    }
  }
  await mod.default({ module_or_path: wasm });
  return mod;
}
/** wasm-bindgen's ES module glue as a classic script that sets window.__wqWorld. */
function classicGlue(js) {
  const names = [...js.matchAll(/^export function (\w+)/gm)].map((m) => m[1]);
  return js.replace(/^export function /gm, "function ").replace(/import\.meta\.url/g, "location.href")
    .replace(/^export \{([^}]*)\};?\s*$/m, (_, list) => `window.__wqWorld = { ${[...names, ...list.split(",").map((x) => x.trim()).filter(Boolean).map((x) => x.replace(/^(\w+) as (\w+)$/, "$2: $1"))].join(", ")} };`);
}

// ---------- the art (Kenney, CC0; cells as WayQuest's canvas uses them) ----------
const rogue = (i) => ["rogue", i], town = (i) => ["town", i], dungeon = (i) => ["dungeon", i];
const SPR = {
  // [sprite, dx, dy] in tiles; dy grows upwards, as in the canvas.
  research: [[town(88), 0, 0], [town(63), 0, 1]],
  task: [[rogue(794), -0.2, 0], [town(115), 0.55, 0.1]],
  grilling: [[rogue(470), 0, 0], [town(106), -0.85, -0.1], [town(106), 0.85, -0.1]],
  prototype: [[rogue(675), -0.5, 0], [rogue(676), 0.5, 0], [rogue(618), -0.5, 1], [rogue(619), 0.5, 1]],
  unknown: [[rogue(19), 0, 0]],
  hall: [[town(72), -1, 0], [town(85), 0, 0], [town(75), 1, 0], [town(64), -1, 1], [town(65), 0, 1], [town(66), 1, 1], [town(52), -1, 2], [town(53), 0, 2], [town(54), 1, 2], [rogue(50), -2, 0.6], [rogue(50), 2, 0.6]],
  cottage: [[town(84), -1, 0], [town(86), 0, 0], [town(48), -1, 1], [town(50), 0, 1], [rogue(50), -2, 0.6]],
  // The buildings of combs without a map.
  keep: [[town(108), -1, 0], [town(112), 0, 0], [town(110), 1, 0], [town(96), -1, 1], [town(97), 0, 1], [town(98), 1, 1], [rogue(50), -2, 0.6], [rogue(50), 2, 0.6]],
  redhouse: [[town(84), -0.5, 0], [town(85), 0.5, 0], [town(52), -0.5, 1], [town(54), 0.5, 1]],
  stonehouse: [[town(88), -0.5, 0], [town(89), 0.5, 0], [town(48), -0.5, 1], [town(50), 0.5, 1]],
};
const BUILDING = { nix: "keep", session: "redhouse", workspace: "stonehouse" };
const FIRE = [rogue(470), rogue(471)];
const MONSTERS = [108, 110, 120, 121, 122, 123, 124].map(dungeon);
const EXPLORERS = [85, 86, 88, 97, 98, 99, 100, 112].map(dungeon);
const TOOL = town(115);
const TALL = [[583, 640], [585, 642], [586, 643], [588, 645]].map(([a, b]) => [rogue(a), rogue(b)]);
const TALL_AUTUMN = [[584, 641], [587, 644]].map(([a, b]) => [rogue(a), rogue(b)]);
const SMALL = [526, 528, 529, 531].map(rogue), SMALL_AUTUMN = [527, 530].map(rogue);
const FLOWERS = [541, 542, 543, 544, 598, 655].map(rogue), WHITE_FLOWER = rogue(652);
const ROCKS = [1251, 1252, 1253, 1308, 1309, 1310].map(rogue);
const AREA = {
  water: { slice: [2, 3, 4, 59, 60, 61, 116, 117, 118], inner: null },
  dirt: { slice: [520, 521, 522, 577, 578, 579, 634, 635, 636], inner: [576, 575, 519, 518] },
  cobble: { slice: [862, 863, 864, 919, 920, 921, 976, 977, 978], inner: [918, 917, 861, 860] },
};
const GRASS_CELLS = [5, 62], WOOD = 119;
const G = { GRASS: 0, CAMP: 8, ROUGH: 28, WATER: 48, WATER2: 68 };
const R = { DIRT: 0, COBBLE: 16, BRIDGE_EW: 32, BRIDGE_NS: 33 };

// Biomes: a comb's land. Green pixels (grass, shores, leaves) are moved to the biome's colour; some biomes
// also grow their own plants from the same sheet.
const BIOMES = {
  meadow: { label: "meadow", swatch: "#7ec850" },
  autumn: { label: "autumn", swatch: "#d9a441", hue: 40, sat: 0.9, lit: (l) => Math.min(0.85, l * 1.08) },
  desert: { label: "desert", swatch: "#e2c27a", hue: 42, sat: 0.55, lit: (l) => Math.min(0.92, l * 1.12 + 0.04), plants: "desert" },
  snow: { label: "snow", swatch: "#e8eef5", hue: 205, sat: 0.2, lit: (l) => 0.45 + l * 0.6, plants: "pines" },
  bloom: { label: "bloom", swatch: "#b77ad8", hue: 285, sat: 0.7, lit: (l) => l },
  marsh: { label: "marsh", swatch: "#4fa59a", hue: 168, sat: 0.55, lit: (l) => l * 0.82 },
};
const BIOME_ORDER = ["meadow", "autumn", "desert", "snow", "bloom", "marsh"];
const BIOME_PREF = { nix: "snow", session: "bloom", workspace: "autumn" };
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [hh * 60, s, l];
}
function hslToRgb(hh, s, l) {
  const k = (n) => (n + hh / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
/** Recolour the green pixels of RGBA data in place for a biome. */
function recolor(data, biome) {
  const b = BIOMES[biome];
  if (!b || b.hue == null) return data;
  for (let i = 0; i < data.length; i += 4) {
    if (!data[i + 3]) continue;
    const [hh, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
    if (hh < 62 || hh > 165 || s < 0.12) continue;
    const [r, g, bb] = hslToRgb((b.hue + (hh - 105) * 0.4 + 360) % 360, Math.min(1, s * b.sat), Math.max(0, Math.min(1, b.lit(l))));
    data[i] = r; data[i + 1] = g; data[i + 2] = bb;
  }
  return data;
}

// The canvas's hashes, bit for bit, so decorations land where WayQuest puts them.
const M64 = (1n << 64n) - 1n;
function hash(a, b) {
  let z = ((BigInt.asUintN(64, BigInt(a)) * 0x9e3779b97f4a7c15n) & M64) ^ ((BigInt.asUintN(64, BigInt(b)) * 0xc2b2ae3d27d4eb4fn) & M64);
  z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & M64;
  z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & M64;
  return z ^ (z >> 31n);
}
function nameHash(s) {
  let hh = 0xcbf29ce484222325n;
  for (const b of new TextEncoder().encode(s)) hh = ((hh ^ BigInt(b)) * 0x100000001b3n) & M64;
  return hh;
}
// Cheap 32-bit noise for the borders between biomes.
function h32(x, y) {
  let hh = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  hh = Math.imul(hh ^ (hh >>> 13), 1274126177);
  return ((hh ^ (hh >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), u0 = x - xi, v0 = y - yi, sm = (t) => t * t * (3 - 2 * t);
  const a = h32(xi, yi), b = h32(xi + 1, yi), c = h32(xi, yi + 1), d = h32(xi + 1, yi + 1), u = sm(u0), v = sm(v0);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

async function loadImage(path) {
  const blob = new Blob([await ue.bytes(path)], { type: "image/png" });
  return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(`${path}: not an image`)); i.src = URL.createObjectURL(blob); });
}

async function loadArt() {
  const [rogueImg, townImg, dungeonImg] = await Promise.all(["roguelike", "tiny-town", "tiny-dungeon"].map((n) => loadImage(`${HERE}/sheets/${n}.png`)));
  const sheets = { rogue: { img: rogueImg, cols: 57 }, town: { img: townImg, cols: 12 }, dungeon: { img: dungeonImg, cols: 12 } };

  // Pixels of the Roguelike sheet, to cut ground quarters and road tiles from (sheets.rs, build_ground_atlas).
  const cv = document.createElement("canvas");
  cv.width = rogueImg.width; cv.height = rogueImg.height;

async function scanComb(c) {
  let files = [];
  try { files = await ue.list(`/datacombs/${c.name}/.scratch`); } catch { files = []; }
  const efforts = files.map(([p]) => /^([^/]+)\/map\.md$/.exec(p)).filter(Boolean).map((m) => m[1]);
  const found = [];
  for (const eff of efforts) {

    const names = files.map(([p]) => p).filter((p) => p.startsWith(pre) && /^\d[^/]*\.md$/.test(p.slice(pre.length))).map((p) => p.slice(pre.length)).sort();

async function scanAll() {
  const combs = (ue.combs || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  for (const c of combs) {
    if (combHeads.get(c.name) === c.head && scanned.has(c.name)) continue;

    case "turn": return `${a.harness || "session"}${model} · turn`;
    case "external": return a.harness === "system" ? "the node" : "you, outside a tool call";
    case "pull": return a.harness && a.harness !== "git" ? `${a.harness}${model} · via git` : a.principal && a.principal !== "user" ? `${a.principal} · via git` : "pulled from git";
    case "rollback": return "rollback";
    case "switch": return "system switch";
    case "genesis": return "created";
    default: return e.kind;
  }
}
async function buildFeed() {
  const rows = [];
  for (const r of regions) {
    if (r.kind !== "map") continue;
    for (const a of await activityOf(r, 8)) for (const c of a.changes) rows.push({ r, entry: a.entry, change: c });
  }
  rows.sort((a, b) => b.entry.time - a.entry.time);
  feed = rows.slice(0, 24);
}
function partsNode(r, parts, ticket) {

}
function ticketLink(r, id) {

// ---------- the screen: the world, and a panel beside it ----------
let panelEl = null;
const stage = h("div", { class: "stage" }, canvas,

function mount() {

/** Select something (null: the world). The panel follows; with focus, the camera too. */
function select(sel, focus) {
  if (sel && !byKey.has(sel.region)) sel = null;
  S.sel = sel;
  if (sel) S.sheet = true;
  save();
  if (panelEl) panelEl.classList.toggle("collapsed", !S.sheet);
  renderPanel();
  if (focus && sel) {
    const reg = byKey.get(sel.region);
    if (typeof sel.ticket === "number") focusTicket(reg, sel.ticket, true);
    else focusRegion(reg, true);
  }
}

function renderPanel() {
  if (!panelEl) return;
  const sel = S.sel, reg = sel && byKey.get(sel.region);
  const sub = document.getElementById("subtitle");
  if (sub) sub.textContent = `${plural((ue.combs || []).length, "comb")} · ${plural(regions.filter((r) => r.kind === "map").length, "map")}`;
  let body, label;
  if (!reg) { body = worldPanel(); label = worldLine(); }
  else if (reg.kind === "comb") { body = combPanel(reg); label = reg.title; }
  else if (sel.ticket === "destination") { body = destinationPanel(reg); label = `${reg.comb} · destination`; }
  else if (typeof sel.ticket === "string" && sel.ticket.startsWith("fog:")) { body = fogPanel(reg, parseInt(sel.ticket.slice(4), 10)); label = `${reg.comb} · fog`; }
  else if (typeof sel.ticket === "number" && reg.byId.get(sel.ticket)) { const t = reg.byId.get(sel.ticket); body = ticketPanel(reg, t); label = `${reg.comb} · #${t.id} ${t.title}`; }
  else { body = mapPanel(reg); label = `${reg.comb} · ${reg.title}`; }

  const ms = maps(), n = (k) => ms.reduce((a, r) => a + r.sum[k], 0);

function worldPanel() {
  const ms = maps(), n = (k) => ms.reduce((a, r) => a + r.sum[k], 0);

function ticketPanel(reg, t) {
  const e = reg.model.encounters.find((x) => x.id === t.id);
  const path = `${combPath(reg.comb)}/.scratch/${reg.effort}/issues/${reg.fileOf.get(t.id)}`;
  const input = h("input", { placeholder: e && e.monster ? "Answer, or ask pi to pick this up…" : "Ask pi about this ticket…" });
  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    ue.prompt(`About "${t.title}" (${path}): ${text}`);
    input.value = "";
    toast((ue.view && ue.view.promptAck) || "Sent to pi in the console.");
  };
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") send(); });
  return [
    crumbs(toWorld, toRegion(reg), { text: `#${t.id}` }),
    h("h3", {}, `#${t.id} ${t.title}`),
    h("div", { class: "chips" },
      e ? h("span", { class: "chip" }, h("i", { class: "dot", style: `background:${STATE_COLOR[e.state]}` }), STATE_WORD[e.state]) : null,
      h("span", { class: "chip" }, t.kind),

      t.blocked_by.length ? [h("dt", {}, "blocked by"), h("dd", {}, t.blocked_by.flatMap((n, i) => [i ? ", " : "", ticketLink(reg, n), reg.byId.get(n) ? ` (${reg.byId.get(n).status})` : ""]))] : null,
      h("dt", {}, "file"), h("dd", { class: "mono" }, path)),
    t.sections.flatMap((s) => [h("h4", {}, s.heading), h("div", { class: "md", html: md(s.body, reg) })]),
    t.comments.length ? h("h4", {}, `Comments · ${t.comments.length}`) : null,
    t.comments.map((c) => h("div", { style: "margin:6px 0" }, h("div", { class: "muted small" }, `${c.author} · ${c.when}`), h("div", { class: "md", html: md(c.body, reg) }))),
    h("div", { class: "ask" }, input, h("button", { onClick: send }, "Send")),
    h("div", { class: "muted small", style: "margin-top:4px" }, "Goes to pi as a message from you; the view itself never writes."),
  ];

function fogPanel(reg, i) {
  const f = reg.model.fog.patches[i];
  if (!f) return mapPanel(reg);
  return [crumbs(toWorld, toRegion(reg), { text: "fog" }), h("h3", {}, `☁ ${f.name || "Fog"}`),

async function setPlayer(v) {
  S.player = String(v || "").trim() || "florek";
  save();
  combHeads.clear();
  feed = null;
  await scanAll();
  renderPanel();
  await buildFeed();
  renderPanel();
}

let loop = 0;
function frame(now) {
  loop = requestAnimationFrame(frame);
  if (!L || !cam || !canvas.width) return;
  drawWorld(canvas.getContext("2d"), cam, now / 1000, canvas.clientWidth, canvas.clientHeight, canvas.width / canvas.clientWidth, { sel: S.sel });
}
function startLoop() { if (!loop) loop = requestAnimationFrame(frame); }

// ---------- a little markdown, for ticket text ----------
function inline(s, r) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) => {
    const m = /(?:^|\/)(\d+)-[^/]*\.md$/.exec(url);
    if (m && r && r.byId && r.byId.has(parseInt(m[1], 10))) return `<span class="link" data-region="${esc(r.key)}" data-ticket="${parseInt(m[1], 10)}">${text}</span>`;
    return `<span class="ext" title="${url}">${text}</span>`;
  });
  out = out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  return out;
}
function md(text, r) {
  const lines = String(text || "").split("\n");
  let html = "", list = null, para = [], code = null;
  const flush = () => { if (para.length) { html += `<p>${inline(para.join(" "), r)}</p>`; para = []; } };
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    if (code != null) { if (/^```/.test(raw)) { html += `<pre><code>${esc(code)}</code></pre>`; code = null; } else code += (code ? "\n" : "") + raw; continue; }
    if (/^```/.test(raw)) { flush(); close(); code = ""; continue; }
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flush(); close(); continue; }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { flush(); close(); html += `<h4>${inline(m[2], r)}</h4>`; continue; }
    if ((m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line))) {
      flush();
      const kind = /\d/.test(m[2]) ? "ol" : "ul";
      if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
      html += `<li${m[1].length >= 2 ? ' style="margin-left:14px"' : ""}>${inline(m[3], r)}</li>`;
      continue;
    }
    if (list && /^\s{2,}\S/.test(raw)) { html = html.replace(/<\/li>$/, ` ${inline(line.trim(), r)}</li>`); continue; }
    close();
    para.push(line.trim());
  }
  if (code != null) html += `<pre><code>${esc(code)}</code></pre>`;
  flush(); close();
  return html;
}
app.addEventListener("click", (ev) => {
  const el = ev.target.closest && ev.target.closest("[data-ticket]");
  if (el) select({ region: el.dataset.region, ticket: parseInt(el.dataset.ticket, 10) }, true);
});

// ---------- live: any comb's new history entry re-reads that comb ----------
let busy = Promise.resolve();
ue.onHistory && ue.onHistory((comb) => {
  busy = busy.then(async () => {
    combHeads.delete(comb);
    await scanAll();
    renderPanel();
    await buildFeed();
    renderPanel();
  }).catch((e) => console.error(e));
});

// ---------- go ----------
try {
  const step = (t) => { const s = app.querySelector(".loading span"); if (s) s.textContent = t; };
  step("loading WayQuest's world crate…");
  world = await loadWorld();
  step("cutting the sprite sheets…");
  art = await loadArt();
  step("reading every comb in datacombs…");
  await scanAll();
  if (S.sel && !byKey.has(S.sel.region)) S.sel = null;
  mount();
  await buildFeed();
  renderPanel();
} catch (e) {
  console.error(e);
  app.replaceChildren(h("div", { class: "loading" }, h("b", {}, "WayQuest could not start"), h("div", { class: "err" }, String((e && e.stack) || e))));
}
})();

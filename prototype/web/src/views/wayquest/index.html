<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WayQuest</title>
<!--
  /nix/view/wayquest/index.html — WayQuest as a view: every project in datacombs.

  A project is a comb. A comb that carries a wayfinder map (.scratch/<effort>/map.md plus issues/NN-*.md)
  is charted, and each map opens as an overworld: cleared territory, the frontier, explorers at work,
  beacons (monsters) where you are needed, and fog for what is not yet specified. Combs without a map
  are listed as uncharted.

  Everything WayQuest knows about wayfinder (parsing, sensing, layout, roads, terrain, what changed)
  comes from its own world crate, compiled to wasm: world.js + world_bg.wasm, beside this file.
  This page only reads files and draws. The sprites are Kenney's (CC0), in sheets/.

  The host gives this page window.ue (all reads are read-only, by gfs path):
    ue.combs                 every comb: name, head, entries, files, newest entry, git remote
    ue.list(dir)             every file under a directory: [[path relative to dir, size]]
    ue.read(path)            a file as text; ue.bytes(path) as bytes. /datacombs/<comb>@<entry>/… is the past
    ue.log(comb)             a comb's history entries, newest first
    ue.onHistory(fn)         fn(comb) whenever any comb gets a history entry
    ue.prompt(text)          send a message to the console as the user
    ue.state, ue.setState(o) a little state the host keeps for this view across re-renders
  It is pi's to change, like any file in /nix; every change is a history entry and can be rolled back.
-->
<style>
:root { --bg:#0f1216; --panel:#161a20; --panel2:#1d232b; --line:#29313b; --fg:#e7eaef; --muted:#8a94a4; --accent:#ffcc66; --link:#8cc8ff;
        --cleared:#9aa3ad; --frontier:#a6f08c; --claimed:#ffc94d; --held:#ff6b59; --blocked:#5c6578; --fog:#c7cde0;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 var(--sans); -webkit-text-size-adjust:100%; }
button { font:inherit; color:inherit; cursor:pointer; }
input, textarea { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.mono { font-family:var(--mono); font-size:12px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
a, .link { color:var(--link); text-decoration:none; cursor:pointer; }
.link:hover { text-decoration:underline; }

/* loading */
.loading { display:flex; align-items:center; justify-content:center; height:100%; flex-direction:column; gap:10px; color:var(--muted); padding:20px; text-align:center; }
.loading b { color:var(--fg); font-size:18px; letter-spacing:.02em; }
.err { color:#ff9d9d; white-space:pre-wrap; font-family:var(--mono); font-size:12px; }

/* atlas */
.atlas { max-width:1180px; margin:0 auto; padding:16px 14px 40px; }
.atlas header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.brand { font-size:22px; font-weight:700; letter-spacing:.01em; }
.brand span { color:var(--accent); }
.sub { color:var(--muted); font-size:13px; }
.totals { display:flex; gap:8px; flex-wrap:wrap; }
.total { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:84px; }
.total .v { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.total .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:22px 0 8px; font-weight:600; }
.needs { background:linear-gradient(180deg, rgba(255,107,89,.10), rgba(255,107,89,.03)); border:1px solid rgba(255,107,89,.35); border-radius:10px; padding:4px 0; }
.row { display:flex; gap:10px; align-items:baseline; padding:7px 12px; cursor:pointer; min-width:0; }
.row:hover { background:rgba(255,255,255,.03); }
.row .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .proj { color:var(--muted); font-family:var(--mono); font-size:12px; flex:none; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:border-color .15s, transform .15s; min-width:0; }
.card:hover { border-color:#3b4656; transform:translateY(-1px); }
.thumb { display:block; width:100%; aspect-ratio:16/7; background:#1d2a1c; image-rendering:auto; }
.card .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.card .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.card .title { font-weight:650; font-size:15px; line-height:1.3; }

.bar i { display:block; height:100%; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; gap:5px; align-items:center; font-size:12px; padding:1px 8px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.last { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { display:inline-block; padding:0 7px; border-radius:999px; font-size:11px; font-weight:600; font-family:var(--mono); background:var(--panel2); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.pill.git { color:#b9d7ff; }
.pill.ok { color:var(--frontier); } .pill.warn { color:var(--claimed); } .pill.bad { color:var(--held); }
.list { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 0; }
.feed .row { cursor:default; align-items:flex-start; }
.feed .when { color:var(--muted); font-size:12px; width:62px; flex:none; font-variant-numeric:tabular-nums; }
.feed .what { flex:1; min-width:0; }
.feed .who { color:var(--muted); font-size:12px; }
.empty { color:var(--muted); padding:12px; }
footer.settings { margin-top:26px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:12px; }
footer.settings input { width:140px; }

/* world */
.world { position:fixed; inset:0; display:grid; grid-template-columns:1fr 360px; grid-template-rows:auto 1fr; }
.wbar { grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding:7px 10px; border-bottom:1px solid var(--line); background:var(--panel); min-width:0; }
.wbar .back { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:3px 10px; flex:none; }
.wbar .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.wbar .name b { font-weight:650; }
.stage { position:relative; overflow:hidden; background:#24361f; min-height:0; }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:grab; }
.stage canvas.drag { cursor:grabbing; }
.hud { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; }
.hud button { width:34px; height:34px; border-radius:8px; border:1px solid rgba(255,255,255,.15); background:rgba(15,18,22,.78); font-size:16px; line-height:1; }
.legend { position:absolute; left:10px; bottom:10px; background:rgba(15,18,22,.78); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:5px 9px; font-size:11.5px; display:flex; gap:10px; flex-wrap:wrap; max-width:calc(100% - 70px); }
.legend span { display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }
.panel { border-left:1px solid var(--line); background:var(--panel); overflow:auto; min-height:0; padding:12px 14px 30px; }
.panel h3 { font-size:16px; margin:2px 0 6px; line-height:1.3; }
.panel h4 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 6px; font-weight:600; }
.panel .row { padding:5px 0; }
.panel .row:hover { background:none; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13px; margin:8px 0; }
.kv dt { color:var(--muted); } .kv dd { margin:0; min-width:0; overflow-wrap:anywhere; }
.md { font-size:13.5px; overflow-wrap:anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:14px 0 4px; }
.md p { margin:6px 0; }
.md ul, .md ol { margin:6px 0; padding-left:20px; }
.md li { margin:2px 0; }
.md code { font-family:var(--mono); font-size:12px; background:var(--panel2); padding:0 4px; border-radius:4px; }
.md pre { background:var(--panel2); padding:8px; border-radius:6px; overflow:auto; font-size:12px; }
.md pre code { background:none; padding:0; }
.md .ext { color:var(--link); border-bottom:1px dotted var(--link); }
.ask { display:flex; gap:6px; margin-top:10px; }
.ask input { flex:1; min-width:0; }
.ask button { border:1px solid transparent; background:var(--accent); color:#1a1408; font-weight:650; border-radius:6px; padding:6px 10px; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#222a35; border:1px solid var(--line); padding:8px 12px; border-radius:8px; font-size:13px; max-width:90vw; z-index:10; }
.sheet-toggle { display:none; }

@media (max-width: 760px) {
  .world { grid-template-columns:1fr; grid-template-rows:auto 1fr auto; }
  .panel { border-left:none; border-top:1px solid var(--line); max-height:46vh; padding-top:6px; }
  .panel.collapsed { max-height:none; overflow:hidden; }
  .panel.collapsed .content { display:none; }
  .sheet-toggle { display:flex; width:100%; justify-content:space-between; align-items:center; background:none; border:none; padding:4px 0 8px; color:var(--muted); font-size:12px; }
  .cards { grid-template-columns:1fr; }
  .legend { display:none; }
  .row .proj { display:none; }
}
</style>

<body>
<div id="app"><div class="loading"><b>WayQuest</b><span>charting datacombs…</span></div></div>
<script>
(async function () {
"use strict";
const ue = window.ue;
const app = document.getElementById("app");
if (!ue || !ue.read) {
  app.innerHTML = '<div class="loading"><b>WayQuest</b><span>This view needs a host that gives it <code>window.ue</code> with gfs reads.</span></div>';
  return;
}
const HERE = (ue.view && ue.view.path ? ue.view.path : "/nix/view/wayquest/index.html").replace(/\/[^/]*$/, "");

// ---------- helpers ----------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  const add = (c) => { if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(add); else el.append(c instanceof Node ? c : document.createTextNode(String(c))); };
  children.forEach(add);
  return el;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function ago(t) {
  if (!t) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
  return new Date(t).toISOString().slice(0, 10);
}
const short = (id) => (id ? String(id).slice(0, 8) : "");
let toastTimer = 0;
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  document.body.append(h("div", { class: "toast" }, text));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.querySelectorAll(".toast").forEach((t) => t.remove()), 3500);
}
const STATE_COLOR = { cleared: "var(--cleared)", frontier: "var(--frontier)", claimed: "var(--claimed)", held: "var(--held)", blocked: "var(--blocked)" };
const STATE_WORD = { cleared: "cleared", frontier: "frontier", claimed: "under way", held: "your move", blocked: "blocked" };

// ---------- state the host keeps for us ----------
const S = Object.assign({ project: null, ticket: null, player: "florek", cams: {}, sheet: true }, ue.state || {});
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => ue.setState && ue.setState({ project: S.project, ticket: S.ticket, player: S.player, cams: S.cams, sheet: S.sheet }), 250);
}

// ---------- WayQuest's world crate (wasm) ----------
async function loadWorld() {
  const js = await ue.read(`${HERE}/world.js`);
  const wasm = await ue.bytes(`${HERE}/world_bg.wasm`);
  let mod;
  try {
    mod = await import(URL.createObjectURL(new Blob([js], { type: "text/javascript" })));
  } catch (e) {
    // No module import from a blob here: run the same glue as a classic script.
    const src = js.replace(/^export function /gm, "function ").replace(/import\.meta\.url/g, "location.href")
      .replace(/^export \{([^}]*)\};?\s*$/m, (_, names) => `window.__wqWorld = { ${names.replace(/(\w+) as (\w+)/g, "$2: $1")} };`);
    const s = document.createElement("script");
    s.textContent = src;
    document.head.append(s);
    mod = window.__wqWorld;
    if (!mod) throw e;
  }
  await mod.default({ module_or_path: wasm });
  return mod;
}

// ---------- the art (Kenney, CC0; cells as WayQuest's canvas uses them) ----------
const rogue = (i) => ["rogue", i], town = (i) => ["town", i], dungeon = (i) => ["dungeon", i];
const SPR = {
  // [sprite, dx, dy] in tiles; dy grows upwards, as in the canvas.
  research: [[town(88), 0, 0], [town(63), 0, 1]],
  task: [[rogue(794), -0.2, 0], [town(115), 0.55, 0.1]],
  grilling: [[rogue(470), 0, 0], [town(106), -0.85, -0.1], [town(106), 0.85, -0.1]],
  prototype: [[rogue(675), -0.5, 0], [rogue(676), 0.5, 0], [rogue(618), -0.5, 1], [rogue(619), 0.5, 1]],
  unknown: [[rogue(19), 0, 0]],
  hall: [[town(72), -1, 0], [town(85), 0, 0], [town(75), 1, 0], [town(64), -1, 1], [town(65), 0, 1], [town(66), 1, 1], [town(52), -1, 2], [town(53), 0, 2], [town(54), 1, 2], [rogue(50), -2, 0.6], [rogue(50), 2, 0.6]],
  cottage: [[town(84), -1, 0], [town(86), 0, 0], [town(48), -1, 1], [town(50), 0, 1], [rogue(50), -2, 0.6]],
};
const FIRE = [rogue(470), rogue(471)];
const MONSTERS = [108, 110, 120, 121, 122, 123, 124].map(dungeon);
const EXPLORERS = [85, 86, 88, 97, 98, 99, 100, 112].map(dungeon);
const TOOL = town(115);
const TALL = [[583, 640], [585, 642], [586, 643], [588, 645]].map(([a, b]) => [rogue(a), rogue(b)]);
const TALL_AUTUMN = [[584, 641], [587, 644]].map(([a, b]) => [rogue(a), rogue(b)]);
const SMALL = [526, 528, 529, 531].map(rogue), SMALL_AUTUMN = [527, 530].map(rogue);
const FLOWERS = [541, 542, 543, 544, 598, 655].map(rogue), WHITE_FLOWER = rogue(652);
const ROCKS = [1251, 1252, 1253, 1308, 1309, 1310].map(rogue);
const AREA = {
  water: { slice: [2, 3, 4, 59, 60, 61, 116, 117, 118], inner: null },
  dirt: { slice: [520, 521, 522, 577, 578, 579, 634, 635, 636], inner: [576, 575, 519, 518] },
  cobble: { slice: [862, 863, 864, 919, 920, 921, 976, 977, 978], inner: [918, 917, 861, 860] },
};
const GRASS_CELLS = [5, 62], WOOD = 119;
const G = { GRASS: 0, CAMP: 8, ROUGH: 28, WATER: 48, WATER2: 68 };
const R = { DIRT: 0, COBBLE: 16, BRIDGE_EW: 32, BRIDGE_NS: 33 };

// The canvas's hashes, bit for bit, so decorations land where WayQuest puts them.
const M64 = (1n << 64n) - 1n;
function hash(a, b) {
  let z = ((BigInt.asUintN(64, BigInt(a)) * 0x9e3779b97f4a7c15n) & M64) ^ ((BigInt.asUintN(64, BigInt(b)) * 0xc2b2ae3d27d4eb4fn) & M64);
  z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & M64;
  z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & M64;
  return z ^ (z >> 31n);
}
function nameHash(s) {
  let h = 0xcbf29ce484222325n;
  for (const b of new TextEncoder().encode(s)) h = ((h ^ BigInt(b)) * 0x100000001b3n) & M64;
  return h;
}

async function loadImage(path) {
  const blob = new Blob([await ue.bytes(path)], { type: "image/png" });
  return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(`${path}: not an image`)); i.src = URL.createObjectURL(blob); });
}

async function loadArt() {
  const [rogueImg, townImg, dungeonImg] = await Promise.all(["roguelike", "tiny-town", "tiny-dungeon"].map((n) => loadImage(`${HERE}/sheets/${n}.png`)));
  const sheets = { rogue: { img: rogueImg, cols: 57 }, town: { img: townImg, cols: 12 }, dungeon: { img: dungeonImg, cols: 12 } };

  // Pixels of the Roguelike sheet, to cut ground quarters and road tiles from (sheets.rs, build_ground_atlas).
  const cv = document.createElement("canvas");
  cv.width = rogueImg.width; cv.height = rogueImg.height;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(rogueImg, 0, 0);
  const data = cx.getImageData(0, 0, cv.width, cv.height).data, W = cv.width;
  const px = (cell, x, y) => { const ox = (cell % 57) * 17, oy = Math.floor(cell / 57) * 17; const i = ((oy + y) * W + ox + x) * 4; return [data[i], data[i + 1], data[i + 2], data[i + 3]]; };
  const tileOf = (cell) => Array.from({ length: 16 }, (_, y) => Array.from({ length: 16 }, (_, x) => px(cell, x, y)));
  const quarter = (t, q) => { const ox = (q % 2) * 8, oy = (q >> 1) * 8; return Array.from({ length: 8 }, (_, y) => Array.from({ length: 8 }, (_, x) => t[oy + y][ox + x])); };
  const over = (top, under) => {
    const a = top[3];
    if (a === 255) return top;
    if (a === 0) return under;
    const mix = (t, u) => Math.floor((t * a + u * (255 - a)) / 255);
    return [mix(top[0], under[0]), mix(top[1], under[1]), mix(top[2], under[2]), 255];
  };
  function areaTiles(area) {
    const [nw, n, ne, w, c, e, sw, s, se] = area.slice.map(tileOf);
    let inner;
    if (area.inner) inner = area.inner.map(tileOf);
    else {
      const profile = Array.from({ length: 16 }, (_, x) => px(area.slice[3], x, 8));
      inner = [0, 1, 2, 3].map((q) => {
        const t = c.map((row) => row.slice());
        for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
          const d = Math.floor(Math.sqrt(x * x + y * y));
          if (d >= 7) continue;
          t[q < 2 ? y : 15 - y][q % 2 === 0 ? x : 15 - x] = profile[d];
        }
        return t;
      });
    }
    return [[nw, ne, sw, se], [n, n, s, s], [w, e, w, e], inner, [c, c, c, c]];
  }
  const grass = GRASS_CELLS.map(tileOf);
  const quarters = [];
  for (const t of grass) for (let q = 0; q < 4; q++) quarters.push(quarter(t, q));
  for (const area of [AREA.dirt, AREA.cobble]) for (const shape of areaTiles(area)) shape.forEach((t, q) => {
    const top = quarter(t, q), under = quarter(grass[0], q);
    quarters.push(top.map((row, y) => row.map((p, x) => over(p, under[y][x]))));
  });
  for (const shape of areaTiles(AREA.water)) shape.forEach((t, q) => quarters.push(quarter(t, q)));
  const deep = tileOf(0);
  for (let q = 0; q < 4; q++) quarters.push(quarter(deep, q));

  // Road tiles: dirt and cobble by connection mask (1 N, 2 E, 4 S, 8 W), then plank bridges.
  const roadTiles = [];
  for (const area of [AREA.dirt, AREA.cobble]) {
    const shapes = areaTiles(area);
    for (let mask = 0; mask < 16; mask++) {
      const nn = !!(mask & 1), e = !!(mask & 2), s = !!(mask & 4), w = !!(mask & 8);
      const conn = [[nn, w], [nn, e], [s, w], [s, e]];
      const t = Array.from({ length: 16 }, () => Array(16).fill([0, 0, 0, 0]));
      conn.forEach(([v, hz], q) => {
        const qd = quarter(shapes[qshape(v, hz, false)][q], q);
        const ox = (q % 2) * 8, oy = (q >> 1) * 8;
        for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) t[oy + y][ox + x] = qd[y][x];
      });
      roadTiles.push(t);
    }
  }
  const wood = [];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const p = px(WOOD, x, y); if (p[3] === 255) wood.push(p); }
  wood.sort((a, b) => a[0] + a[1] + a[2] - (b[0] + b[1] + b[2]));
  const dark = wood[0] || [90, 56, 34, 255], light = wood[wood.length - 1] || [190, 130, 80, 255], mid = wood[wood.length >> 1] || [150, 100, 60, 255];

// ---------- datacombs → projects ----------
let world, art;
const projects = new Map(); // `${comb}/${effort}` → project
let uncharted = []; // comb summaries without a map
const combHeads = new Map(); // comb → head we scanned
let feed = null; // recent changes across every project
const combPath = (name) => (name === "nix" ? "/nix" : `/datacombs/${name}`);

async function scanComb(c) {
  let files = [];
  try { files = await ue.list(`/datacombs/${c.name}/.scratch`); } catch { files = []; }
  const efforts = files.map(([p]) => /^([^/]+)\/map\.md$/.exec(p)).filter(Boolean).map((m) => m[1]);
  const found = [];
  for (const eff of efforts) {
    const dir = `/datacombs/${c.name}/.scratch/${eff}`, pre = `${eff}/issues/`;
    const names = files.map(([p]) => p).filter((p) => p.startsWith(pre) && /^\d[^/]*\.md$/.test(p.slice(pre.length))).map((p) => p.slice(pre.length)).sort();
    const map = await ue.read(`${dir}/map.md`);
    const tickets = await Promise.all(names.map(async (n) => [n, await ue.read(`${dir}/issues/${n}`)]));
    found.push({ key: `${c.name}/${eff}`, comb: c.name, effort: eff, dir, files: { id: eff, map, tickets }, combInfo: c });
  }
  return found;
}

function build(p) {
  const input = JSON.stringify({ ...p.files, player: S.player, at: new Date().toISOString() });
  p.model = JSON.parse(world.overworld(input));
  p.tracker = JSON.parse(world.tracker(JSON.stringify(p.files)));
  p.byId = new Map(p.tracker.tickets.map((t) => [t.id, t]));
  p.fileOf = new Map(p.files.tickets.map(([n]) => [parseInt(n, 10), n]));
  const enc = p.model.encounters;
  const count = (f) => enc.filter(f).length;
  p.sum = {
    total: enc.length,
    cleared: count((e) => e.state === "cleared"),
    frontier: count((e) => e.state === "frontier"),
    underway: count((e) => e.state === "claimed" || e.state === "held"),
    blocked: count((e) => e.state === "blocked"),
    beacons: count((e) => e.monster),
    fog: p.model.fog.patches.length,
  };
  p.layer = buildLayer(p);
  p.activity = null;
}

async function scanAll() {
  const combs = ue.combs || [];
  const live = new Set(combs.map((c) => c.name));
  for (const k of [...projects.keys()]) if (!live.has(projects.get(k).comb)) projects.delete(k);
  const un = [];
  for (const c of combs) {
    if (combHeads.get(c.name) !== c.head) {
      const found = await scanComb(c);
      for (const k of [...projects.keys()]) if (projects.get(k).comb === c.name) projects.delete(k);
      for (const p of found) { build(p); projects.set(p.key, p); }
      combHeads.set(c.name, c.head);
    } else for (const p of projects.values()) if (p.comb === c.name) p.combInfo = c;
    if (![...projects.values()].some((p) => p.comb === c.name)) un.push(c);
  }
  uncharted = un;
}

// ---------- history → what changed, and who ----------
function filesOf(id, m) {
  const map = m.get("map.md");
  if (map == null) return null;
  return { id, map, tickets: [...m].filter(([k]) => /^issues\/\d[^/]*\.md$/.test(k)).map(([k, v]) => [k.slice(7), v]).sort() };
}
function diffStates(p, prev, next, entry) {
  const a = filesOf(p.effort, prev), b = filesOf(p.effort, next);
  if (!b) return [{ what: "map_removed", text: "map removed", parts: [{ text: "map removed" }] }];
  if (!a) return [{ what: "charted", text: `charted: ${b.tickets.length} tickets`, parts: [{ text: `charted: ${b.tickets.length} tickets` }] }];
  const out = JSON.parse(world.changes(JSON.stringify({ prev: a, next: b, player: S.player })));
  if (out.length) return out;
  // Nothing on the overworld changed: say which texts were edited.
  const pre = `.scratch/${p.effort}/`;
  const touched = [...entry.summary.added, ...entry.summary.modified, ...entry.summary.removed].filter((x) => x.startsWith(pre)).map((x) => x.slice(pre.length));
  const ids = [...new Set(touched.map((x) => /^issues\/(\d+)/.exec(x)).filter(Boolean).map((m) => parseInt(m[1], 10)))];
  const parts = [];
  if (touched.includes("map.md")) parts.push({ text: "map notes edited" });
  ids.forEach((id, i) => { if (parts.length) parts.push({ text: i ? ", " : "; " }); parts.push({ ticket: id }); parts.push({ text: " edited" }); });
  return [{ what: "edited", text: "", parts: parts.length ? parts : [{ text: "edited" }] }];
}

async function activityOf(p, limit) {
  if (p.activity && (p.activity.length >= limit || p.activityDone)) return p.activity;
  const log = await ue.log(p.comb);
  const pre = `.scratch/${p.effort}/`;
  const touches = (e) => e.summary && [...e.summary.added, ...e.summary.modified, ...e.summary.removed].some((x) => x.startsWith(pre));
  let state = new Map([["map.md", p.files.map], ...p.files.tickets.map(([n, t]) => [`issues/${n}`, t])]);
  const out = [];
  let done = true;
  for (const e of log) {
    if (!touches(e)) continue;
    if (out.length >= limit) { done = false; break; }
    const prev = new Map(state), rel = (x) => x.slice(pre.length);
    for (const x of e.summary.added) if (x.startsWith(pre)) prev.delete(rel(x));
    for (const x of [...e.summary.modified, ...e.summary.removed]) if (x.startsWith(pre)) {
      if (!e.parent) { prev.delete(rel(x)); continue; }
      try { prev.set(rel(x), await ue.read(`/datacombs/${p.comb}@${e.parent}/${x}`)); } catch { prev.delete(rel(x)); }
    }
    out.push({ entry: e, changes: diffStates(p, prev, state, e) });
    state = prev;
  }
  p.activity = out;
  p.activityDone = done;
  return out;
}

/** Who made a history entry, in a few words. */
function who(e) {
  const a = e.author || {};
  const model = a.model ? ` (${a.model})` : "";
  switch (e.kind) {
    case "tool_call": return `${a.harness || "session"}${model} · ${e.tool_name || "tool"}`;
    case "turn": return `${a.harness || "session"}${model} · turn`;
    case "external": return a.harness === "system" ? "the node" : "you, outside a tool call";
    case "pull": return a.harness && a.harness !== "git" ? `${a.harness}${model} · via git` : a.principal && a.principal !== "user" ? `${a.principal} · via git` : "pulled from git";
    case "rollback": return "rollback";
    case "genesis": return "created";
    default: return e.kind;
  }
}

    const m0 = [(was[0][0] + was[1][0]) / 2, (was[0][1] + was[1][1]) / 2], m1 = [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2];
    const s = Math.min(6, Math.max(0.12, gesture.cam.s * (d1 / d0))), k = s / gesture.cam.s;
    cam = { s, x: m1[0] - (m0[0] - gesture.cam.x) * k, y: m1[1] - (m0[1] - gesture.cam.y) * k };
    gesture.moved = 99;
  }
});
const endPointer = (ev) => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.delete(ev.pointerId);
  if (gesture && pointers.size === 0) {
    if (gesture.moved < 6 && performance.now() - gesture.t < 500) tap(gesture.start[0], gesture.start[1]);
    gesture = null;
    saveCam();
    canvas.classList.remove("drag");
  } else if (gesture) gesture = { ...gesture, cam: { ...cam }, pts: new Map(pointers) };
};
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(Math.exp(-ev.deltaY * (ev.deltaMode ? 0.05 : 0.0015)), ev.offsetX, ev.offsetY); }, { passive: false });
window.addEventListener("resize", () => requestAnimationFrame(resize));

function tap(sx, sy) {
  const p = cur, L = p.layer, m = p.model;
  const lx = (sx - cam.x) / cam.s, ly = (sy - cam.y) / cam.s, pad = 10 / cam.s;
  let best = null, bd = Infinity;
  for (const e of m.encounters) {
    const [x, y] = L.P(...e.pos), cx = x, cy = y - 6;
    if (Math.abs(lx - cx) <= 15 + pad && Math.abs(ly - cy) <= 17 + pad) { const d = Math.hypot(lx - cx, ly - cy); if (d < bd) { bd = d; best = e.id; } }
  }
  if (best != null) return select(best);
  const fi = m.fog.patches.findIndex((f) => { const [x, y] = L.P(...f.pos); return Math.hypot(lx - x, ly - y) <= 20 + pad; });
  if (fi >= 0) { S.ticket = `fog:${fi}`; save(); return renderPanel(); }
  const [dx, dy] = L.P(...m.destination.pos);
  if (Math.abs(lx - dx) <= 26 + pad && ly >= dy - 42 - pad && ly <= dy + 10 + pad) { S.ticket = "destination"; save(); return renderPanel(); }
  if (S.ticket != null) { S.ticket = null; save(); renderPanel(); }
}

function frame(now) {
  loop = requestAnimationFrame(frame);
  if (screen !== "world" || !cur || !cam || !canvas.width) return;
  const dpr = canvas.width / canvas.clientWidth;
  drawWorld(canvas.getContext("2d"), cur, cam, now / 1000, canvas.clientWidth, canvas.clientHeight, dpr, { selected: typeof S.ticket === "number" ? S.ticket : null });
}
function startLoop() { if (!loop) loop = requestAnimationFrame(frame); }
function stopLoop() { if (loop) cancelAnimationFrame(loop); loop = 0; }

// ---------- a little markdown, for ticket text ----------
function inline(s, p) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) => {
    const m = /(?:^|\/)(\d+)-[^/]*\.md$/.exec(url);
    if (m && p && p.byId.has(parseInt(m[1], 10))) return `<span class="link" data-ticket="${parseInt(m[1], 10)}">${text}</span>`;
    return `<span class="ext" title="${url}">${text}</span>`;
  });
  out = out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  return out;
}
function md(text, p) {
  const lines = String(text || "").split("\n");
  let html = "", list = null, para = [], code = null;
  const flush = () => { if (para.length) { html += `<p>${inline(para.join(" "), p)}</p>`; para = []; } };
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    if (code != null) { if (/^```/.test(raw)) { html += `<pre><code>${esc(code)}</code></pre>`; code = null; } else code += (code ? "\n" : "") + raw; continue; }
    if (/^```/.test(raw)) { flush(); close(); code = ""; continue; }
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flush(); close(); continue; }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { flush(); close(); html += `<h4>${inline(m[2], p)}</h4>`; continue; }
    if ((m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line))) {
      flush();
      const kind = /\d/.test(m[2]) ? "ol" : "ul";
      if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
      html += `<li${m[1].length >= 2 ? ' style="margin-left:14px"' : ""}>${inline(m[3], p)}</li>`;
      continue;
    }
    if (list && /^\s{2,}\S/.test(raw)) { html = html.replace(/<\/li>$/, ` ${inline(line.trim(), p)}</li>`); continue; }
    close();
    para.push(line.trim());
  }
  if (code != null) html += `<pre><code>${esc(code)}</code></pre>`;
  flush(); close();
  return html;
}
app.addEventListener("click", (ev) => {
  const el = ev.target.closest && ev.target.closest("[data-ticket]");
  if (el && cur) select(parseInt(el.dataset.ticket, 10));
});

// ---------- live: any comb's new history entry re-reads that comb ----------
let busy = Promise.resolve();
function rerender() {
  if (screen === "world" && cur) {
    const p = projects.get(cur.key);
    if (!p) return renderAtlas();
    if (p !== cur) { cur = p; renderWorld(); } else renderPanel();
  } else renderAtlas();
}
ue.onHistory && ue.onHistory((comb) => {
  busy = busy.then(async () => {
    combHeads.delete(comb);
    await scanAll();
    await buildFeed();
    rerender();
  }).catch((e) => console.error(e));
});

// ---------- go ----------
try {
  const step = (t) => { const s = app.querySelector(".loading span"); if (s) s.textContent = t; };
  step("loading WayQuest's world crate…");
  world = await loadWorld();
  step("cutting the sprite sheets…");
  art = await loadArt();
  step("reading every comb in datacombs…");
  await scanAll();
  if (S.project && projects.has(S.project)) openProject(S.project, S.ticket);
  else renderAtlas();
  await buildFeed();
  if (screen === "atlas") renderAtlas();
} catch (e) {
  console.error(e);
  app.replaceChildren(h("div", { class: "loading" }, h("b", {}, "WayQuest could not start"), h("div", { class: "err" }, String((e && e.stack) || e))));
}
})();
</script>
